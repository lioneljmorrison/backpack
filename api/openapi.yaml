openapi: 3.1.0
info:
  title: Backpack
  version: 0.4.0
  description: >-
    A Kanban board for agentic projects. Every route under /v1, and the MCP
    server at /mcp, requires a bearer token issued with `backpack token
    create --actor <name>`.
servers:
  - url: http://localhost:8780
    description: Local development
security:
  - bearer: []
paths:
  /healthz:
    get:
      summary: Service and dependency health
      description: >-
        The only unauthenticated route. Reports each dependency as `ok` or
        `unavailable`; failure details are logged, never returned.
      security: []
      responses:
        "200":
          description: Every dependency is healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: At least one dependency is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /v1/whoami:
    get:
      summary: The actor the presented token belongs to
      responses:
        "200":
          description: The token is live
          content:
            application/json:
              schema:
                type: object
                required: [actor]
                properties:
                  actor: { type: string, example: lionel }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /mcp:
    post:
      summary: The MCP server, for agents
      description: >-
        MCP over streamable HTTP, stateless: no sessions are kept, and every
        call carries its own token. Each tool takes the workspace slug, calls
        the same board operation as its HTTP route and answers with the same
        JSON. A board refusal is a tool error carrying its reason. The tools
        are listed in docs/PLAN.md. Only POST is served.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: A JSON-RPC 2.0 message }
      responses:
        "200":
          description: The JSON-RPC response, as JSON or an event stream
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/workspaces:
    get:
      summary: Every workspace, by slug
      responses:
        "200":
          description: The workspaces
          content:
            application/json:
              schema:
                type: object
                required: [workspaces]
                properties:
                  workspaces:
                    type: array
                    items: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Create a workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name]
              additionalProperties: false
              properties:
                slug: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", maxLength: 64, example: my-app }
                name: { type: string, example: My app }
                repo_url: { type: string }
                has_release_stage:
                  type: boolean
                  default: false
                  description: Seeds the workspace's branches, once, at creation. True gives dev merging into main, and main; false gives main alone.
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/workspaces/{ws}/next:
    parameters:
      - $ref: "#/components/parameters/Workspace"
    get:
      summary: What's next
      description: The highest-ranked backlog story that is not blocked.
      responses:
        "200":
          description: The story, or null when nothing in the backlog is ready
          content:
            application/json:
              schema:
                type: object
                required: [story]
                properties:
                  story:
                    oneOf:
                      - $ref: "#/components/schemas/Story"
                      - type: "null"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/workspaces/{ws}/status:
    parameters:
      - $ref: "#/components/parameters/Workspace"
    get:
      summary: Where are we
      description: >-
        The first phase that is not complete, what is in progress, in review
        and on hold, the top three of the backlog, and the stories and ideas
        waiting for approval. Send
        `Accept: text/plain` for a few lines of text, as the session hook does.
      responses:
        "200":
          description: Where the workspace stands
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Where" }
            text/plain:
              schema: { type: string }
              example: |
                Phase 2: Features — 1 of 4 stories complete
                In progress:
                  S-6 Search — building
                In review:
                  S-5 Ranking — https://example.com/pr/5
                Next:
                  S-7 Export
                  S-8 Import — blocked by S-7
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/workspaces/{ws}/board:
    parameters:
      - $ref: "#/components/parameters/Workspace"
    get:
      summary: Every story by column, each column in delivery order
      description: >-
        Merged has one column per branch, in merge order, each naming its
        branch; a story is in the column of the furthest branch it reached.
        Released, the last step, follows the Merged columns; Closed is last.
      responses:
        "200":
          description: The columns, in board order
          content:
            application/json:
              schema:
                type: object
                required: [columns]
                properties:
                  columns:
                    type: array
                    items:
                      type: object
                      required: [status, stories]
                      properties:
                        status: { $ref: "#/components/schemas/Status" }
                        branch: { type: string, description: "On a merged column: the branch it is for" }
                        stories:
                          type: array
                          items: { $ref: "#/components/schemas/Story" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/workspaces/{ws}/branches:
    parameters:
      - $ref: "#/components/parameters/Workspace"
    get:
      summary: The workspace's branches in merge order
      description: Each branch comes before the one it merges into; the release branch, which merges nowhere, is last.
      responses:
        "200":
          description: The branches
          content:
            application/json:
              schema:
                type: object
                required: [branches]
                properties:
                  branches:
                    type: array
                    items: { $ref: "#/components/schemas/Branch" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Add a branch
      description: >-
        Adds a branch that merges into an existing one, such as staging into
        main. No story moves, because stories name their branch. `into` is
        required: a workspace has one release branch, the one that merges
        nowhere, and it is already there. A name that is empty, has whitespace
        or is over 100 characters is refused (400), as is one already in use
        (409) and an `into` that names no branch (404). While several branches
        nothing merges into exist (dev and staging, both into main), a story in
        review is merged into one by naming it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, into]
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 100, description: The new branch's name, plain text with no whitespace }
                into: { type: string, description: The existing branch it merges into }
                alias: { type: string, maxLength: 100, description: The web column heading's name for the branch, plain text }
      responses:
        "201":
          description: The new branch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branch" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/workspaces/{ws}/branches/{name}:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - name: name
        in: path
        required: true
        description: The branch, by its current name
        schema: { type: string }
    patch:
      summary: Change a branch
      description: >-
        Fields not given are left as they are. A new name replaces the old one
        everywhere the board refers to it: the branches that merge into this
        one and the stories that reached it. Every story stays in its column,
        and past log entries keep the old name. A name that is empty, has
        whitespace or is over 100 characters is refused, as is one already in
        use. Giving the branch's own name changes nothing. An alias is the name the
        web board's column heading shows for the branch ("Merged (Production)");
        the API, tools and logs keep using the name. An empty alias clears it.
        `into` changes the branch it merges into, with no story moving; a
        story merged into this branch goes on to the new one at its next
        merge. It is refused with 409 for the branch itself, a branch that
        leads back to this one, the release branch (which merges nowhere) and
        an empty `into` on any other branch (a second release branch), and
        with 404 when it names no branch. Merging into where it already merges
        changes nothing. All the fields given are applied together or not at
        all.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 100, description: The new name, plain text with no whitespace }
                alias: { type: string, maxLength: 100, description: "The web column heading's name for the branch, plain text; an empty string clears it" }
                into: { type: string, description: The existing branch it merges into from now on }
      responses:
        "200":
          description: The branch as it is now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branch" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      summary: Remove a branch
      description: >-
        Removes a branch only when nothing refers to it: no story is merged
        into it (whatever its status) and no branch merges into it. It is
        refused with 409, the reason naming the stories and branches still on
        it, and for the release branch and for the first branch (the only
        branch nothing merges into). With several branches nothing merges into,
        an empty one can be removed. Past log entries keep the removed name.
        An unknown branch is 404.
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/workspaces/{ws}/branches/{name}/merged:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - name: name
        in: path
        required: true
        description: The branch that was merged, such as dev
        schema: { type: string }
    post:
      summary: Record a branch merged into the next, moving every story on it
      description: >-
        Moves every story merged into the branch to the branch it merges into,
        as one change, each with a status entry in its log naming the merge
        commit. Stories still in progress or in review stay put. A branch with
        nothing merged into it answers with an empty list. The release branch
        merges nowhere, so it is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commit]
              additionalProperties: false
              properties:
                commit: { type: string, description: The merge commit }
      responses:
        "200":
          description: The stories that moved, as they are now
          content:
            application/json:
              schema:
                type: object
                required: [stories]
                properties:
                  stories:
                    type: array
                    items: { $ref: "#/components/schemas/Story" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/workspaces/{ws}/events:
    parameters:
      - $ref: "#/components/parameters/Workspace"
    get:
      summary: The latest events, however old
      description: >-
        What happened lately, as short lines, oldest first: decisions,
        corrections, stories moved to merged, on hold or closed, stories and
        ideas added, and releases cut. Without options, the latest 20, however
        long ago; it is empty only on a board where nothing has happened. Each
        action shows once (a release's own entries are left out for its one
        line, and a proposal's placement is part of its added line). Each
        event's id is its position, ordered by time to the second, then kind
        (story, idea, release, log), then number. Give at most one of
        before, after and since. Entries recorded before releases are labelled
        as such. A result is capped by the store at 10,000 rows. Over MCP this
        is list_events, run through actions.
      parameters:
        - name: before
          in: query
          description: A position (L-41, S-3, I-2, R-1); the 20 events before it.
          schema: { type: string, example: L-41 }
        - name: after
          in: query
          description: >-
            A position; every event from its second on, except that position
            itself. The rest of its own second repeats, so none is missed.
          schema: { type: string, example: L-41 }
        - name: since
          in: query
          description: >-
            An RFC 3339 time, or a date taken as midnight UTC; every event
            from then on, inclusive.
          schema: { type: string, example: "2026-10-31" }
      responses:
        "200":
          description: The events, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/Event" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/workspaces/{ws}/releases:
    parameters:
      - $ref: "#/components/parameters/Workspace"
    get:
      summary: The workspace's releases, newest first
      description: >-
        Newest first by number (R-10 before R-9). Each release lists the ids
        of its stories in delivery order; read one release for them in full.
      responses:
        "200":
          description: The releases; an empty list when none has been cut
          content:
            application/json:
              schema:
                type: object
                required: [releases]
                properties:
                  releases:
                    type: array
                    items: { $ref: "#/components/schemas/Release" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Cut a release, releasing every story merged into the release branch
      description: >-
        Records an official release (R-n) with a version and the git tag that
        marks it. In one change, every story merged into the release branch
        that is not in a release yet becomes Released, is linked to the new
        release, and gets a status entry in its log from merged to released
        that names the release (and the release commit, when given). Stories
        merged into other branches, and those in progress or in review, stay
        put. Backpack does not talk to GitHub; the caller records the tag. A
        version already released is a conflict, and so is a cut with nothing
        to release.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, tag]
              additionalProperties: false
              properties:
                version: { type: string, example: v1.0.0 }
                tag: { type: string, description: The git tag that marks the release, example: v1.0.0 }
                commit: { type: string, description: The commit the tag points at }
                notes: { type: string }
      responses:
        "201":
          description: The release, with the ids of its stories in delivery order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Release" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/workspaces/{ws}/releases/{id}:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - name: id
        in: path
        required: true
        schema: { type: string, example: R-1 }
    get:
      summary: One release with its stories, as a changelog
      responses:
        "200":
          description: The release; stories are the full stories, in delivery order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleaseDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/workspaces/{ws}/phases:
    parameters:
      - $ref: "#/components/parameters/Workspace"
    get:
      summary: The workspace's phases in order, each with its goals
      responses:
        "200":
          description: The phases
          content:
            application/json:
              schema:
                type: object
                required: [phases]
                properties:
                  phases:
                    type: array
                    items: { $ref: "#/components/schemas/Phase" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Add a phase, numbered after the last one
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              additionalProperties: false
              properties:
                title: { type: string }
                description: { type: string }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Phase" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/workspaces/{ws}/phases/{n}:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/PhaseNumber"
    patch:
      summary: Edit a phase's title or description
      description: >-
        Fields left out are unchanged. Each field that changes is logged on
        the phase with its old and new value (see the phase's log).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title: { type: string, minLength: 1 }
                description: { type: string }
      responses:
        "200":
          description: The phase as it is now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Phase" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/workspaces/{ws}/phases/{n}/goals:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/PhaseNumber"
    post:
      summary: Add a goal to a phase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              additionalProperties: false
              properties:
                text: { type: string }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goal" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/workspaces/{ws}/goals/{id}:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - name: id
        in: path
        required: true
        schema: { type: string, example: G-1 }
    patch:
      summary: Mark a goal met or unmark it, or change its text
      description: >-
        Give met or text, one of them. A change of text is logged on the goal
        with the old and new text; setting the text it already has changes
        and logs nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              maxProperties: 1
              properties:
                met: { type: boolean }
                text: { type: string, minLength: 1 }
      responses:
        "200":
          description: The goal as it is now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goal" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/workspaces/{ws}/phases/{n}/log:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/PhaseNumber"
    get:
      summary: The phase's log, oldest entry first
      description: One edit entry for each field an edit changed.
      responses:
        "200":
          description: The entries
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/LogEntry" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/workspaces/{ws}/goals/{id}/log:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - name: id
        in: path
        required: true
        schema: { type: string, example: G-1 }
    get:
      summary: The goal's log, oldest entry first
      description: One edit entry for each change of its text.
      responses:
        "200":
          description: The entries
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/LogEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/workspaces/{ws}/stories:
    parameters:
      - $ref: "#/components/parameters/Workspace"
    get:
      summary: The backlog in delivery order, top first
      responses:
        "200":
          description: The stories
          content:
            application/json:
              schema:
                type: object
                required: [stories]
                properties:
                  stories:
                    type: array
                    items: { $ref: "#/components/schemas/Story" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Add a story
      description: >-
        Placed directly before or after a named story, or at the bottom of the
        backlog when neither is given. A story's phase is set here and cannot
        be changed later. A story added here goes straight into the backlog;
        an agent's story, added through the MCP, is proposed instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              additionalProperties: false
              properties:
                title: { type: string }
                description: { type: string }
                goal: { type: string }
                plan: { type: string }
                kind: { type: string, enum: [bug], description: "Mark the story as a bug; omit for any other story" }
                found_in: { type: string, example: S-3, description: "The story this one was found while building; 404 if unknown, 409 if closed" }
                phase: { type: integer, minimum: 1, description: "Omit for a story with no phase" }
                before: { type: string, example: S-3 }
                after: { type: string, example: S-2 }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Story" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/workspaces/{ws}/stories/{id}:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/StoryID"
    get:
      summary: One story, with its dependencies in both directions
      responses:
        "200":
          description: The story
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Story" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Edit a story, or say what it is doing
      description: >-
        Fields left out are unchanged. Activity is set only while the story is
        in progress (409 otherwise), and waiting_on only while its activity is
        waiting. Setting another activity clears waiting_on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title: { type: string, minLength: 1 }
                description: { type: string }
                goal: { type: string }
                plan: { type: string }
                activity: { $ref: "#/components/schemas/Activity" }
                waiting_on: { type: string, example: the review agent }
                branch: { type: string }
                pr_url: { type: string }
                kind: { type: string, enum: [bug, ""], description: "bug marks the story as a bug; an empty string clears the mark" }
      responses:
        "200":
          description: The story as it is now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Story" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/workspaces/{ws}/stories/{id}/move:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/StoryID"
    post:
      summary: Move a story in the backlog
      description: >-
        Refused when the story would rank above something it depends on, or
        below something that depends on it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Position" }
      responses:
        "200":
          description: The story as it is now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Story" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/workspaces/{ws}/stories/{id}/status:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/StoryID"
    post:
      summary: Move a story to another column
      description: >-
        Forward one column, or back one before Merged: Backlog, In progress,
        In review, Merged. Merging records the branch reached (`into`;
        none means the branch no other merges into; when several are like that, such
        as dev and staging both into main, a merge from review must name one, and
        is refused with the choices if it does not) and a story
        moves on only to the branch its current one merges into, one step at a
        time, as a merged-to-merged move with that branch and its merge commit.
        Released is not set here: `released` and the old `deployed` are
        refused (400) with a message naming the release action, `POST
        /v1/workspaces/{ws}/releases`, which releases the stories merged into
        the release branch.
        From Proposed, Backlog, In progress or In review a story can be put on hold,
        and resumes in the column it left (a held proposal resumes to Proposed, to be approved as usual); from those and On hold it can be
        closed. Released and Closed are final. Starting a blocked story needs
        a workaround, which is logged as a decision; a blocked story is never
        merged. Closing is refused while any story depends on this one. Every
        change writes a status entry in the story's log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              additionalProperties: false
              properties:
                to: { $ref: "#/components/schemas/Status" }
                branch: { type: string, description: "Only when starting" }
                workaround: { type: string, description: "Only when starting a blocked story", example: build against mock data }
                pr_url: { type: string, description: "Only when opening review" }
                commit: { type: string, description: "Only when merging" }
                into: { type: string, description: "Only when merging: the branch merged into; none means the only branch nothing merges into; with several, name one" }
                reason: { type: string, description: "Required when holding or closing, and only then" }
      responses:
        "200":
          description: The story as it is now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Story" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/workspaces/{ws}/stories/{id}/reviewed:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/StoryID"
    post:
      summary: Clear the story's upstream-changed mark
      description: >-
        Says the story was looked at after a story it depends on changed its
        goal or plan. The reason is logged on the story as a note. Updating the
        story's own goal or plan also clears the mark. A story that is not
        marked is refused with 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, description: "What was checked or changed; plain text" }
      responses:
        "200":
          description: The story as it is now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Story" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/workspaces/{ws}/stories/{id}/context:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/StoryID"
    get:
      summary: A story's neighbourhood in summaries
      description: >-
        One read in place of many: the story's phase with its goals, the idea
        it came from, what it depends on and what depends on it (read from the
        dependency links, so finished dependencies are included, unlike the
        story read), where it was found and what was found while building it,
        and the open bugs found in it or in its direct dependencies (up to
        five). Detail stays with the story and its log. Over MCP this is
        get_context, run through actions.
      responses:
        "200":
          description: The context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoryContext" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/workspaces/{ws}/stories/{id}/log:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/StoryID"
    get:
      summary: The story's log, oldest entry first
      responses:
        "200":
          description: The entries
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/LogEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Append an entry to the story's log
      description: >-
        Entries are never edited or deleted. A note needs text; a decision,
        text and reason; a commit, its id; a pr, its link; a correction, text
        and the earlier entry of this story it corrects. Status entries are
        written only by status changes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              additionalProperties: false
              properties:
                kind: { type: string, enum: [note, decision, commit, pr, correction] }
                text: { type: string }
                reason: { type: string }
                commit: { type: string }
                pr_url: { type: string }
                corrects: { type: string, example: L-3 }
      responses:
        "201":
          description: Logged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogEntry" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/workspaces/{ws}/stories/{id}/dependencies:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/StoryID"
    post:
      summary: Record that this story depends on another
      description: >-
        The story depended on must rank above this one, be in the same or an
        earlier phase when both have a phase, must not already depend on this
        one, and must not be closed. A closed or complete story gains no
        dependencies. Recording an existing dependency changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [on]
              additionalProperties: false
              properties:
                on: { type: string, example: S-1 }
      responses:
        "200":
          description: The dependent story as it is now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Story" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/workspaces/{ws}/stories/{id}/dependencies/{on}:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/StoryID"
      - name: on
        in: path
        required: true
        schema: { type: string, example: S-1 }
    delete:
      summary: Remove a dependency
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/workspaces/{ws}/ideas:
    parameters:
      - $ref: "#/components/parameters/Workspace"
    get:
      summary: The ideas that are not closed, in order, top first
      responses:
        "200":
          description: The ideas list
          content:
            application/json:
              schema:
                type: object
                required: [ideas]
                properties:
                  ideas:
                    type: array
                    items: { $ref: "#/components/schemas/Idea" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Add an idea
      description: >-
        Placed directly before or after a named idea, or at the bottom of the
        ideas list when neither is given. An idea is open from the start,
        whoever adds it; only stories wait for approval.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              additionalProperties: false
              properties:
                title: { type: string }
                context:
                  type: string
                  description: >-
                    Anything that helps understand the idea and turn it into
                    work: notes, links, documents, background. Optional, but an
                    idea without context is only as good as its title.
                before: { type: string, example: I-3 }
                after: { type: string, example: I-2 }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Idea" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/workspaces/{ws}/ideas/{id}:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/IdeaID"
    get:
      summary: One idea, closed or not
      responses:
        "200":
          description: The idea
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Idea" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Edit an idea that is not closed
      description: Fields not given are left as they are.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title: { type: string, minLength: 1 }
                context: { type: string }
      responses:
        "200":
          description: The idea as it is now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Idea" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/workspaces/{ws}/ideas/{id}/move:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/IdeaID"
    post:
      summary: Move an idea that is not closed
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Position" }
      responses:
        "200":
          description: The idea as it is now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Idea" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/workspaces/{ws}/ideas/{id}/refine:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/IdeaID"
    post:
      summary: Close an open idea, linking it to what it became
      description: >-
        The stories and the phase are added first, the usual way. At least
        one is named, and none of the stories may be closed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                stories:
                  type: array
                  items: { type: string, example: S-4 }
                phase: { type: integer, minimum: 1 }
      responses:
        "200":
          description: The idea, now closed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Idea" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/workspaces/{ws}/ideas/{id}/drop:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/IdeaID"
    post:
      summary: Close an idea that became nothing, with the reason
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string }
      responses:
        "200":
          description: The idea, now closed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Idea" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/workspaces/{ws}/search:
    parameters:
      - $ref: "#/components/parameters/Workspace"
    get:
      summary: Find stories, ideas and phases by keyword and by meaning
      description: >-
        Answers "do we already have something about this?". Keywords match
        every text field, a story's log included; meaning is matched on the
        title and summary by a model that runs inside the stack. Up to ten
        matches, best first. Closed stories and dropped ideas are included,
        with their state. The index is rebuilt from the board; it never
        decides anything on the board.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, example: sign in without a password }
        - name: story
          in: query
          required: false
          description: >-
            A story id. The search looks near the story first: the story, its
            dependencies and dependents, where it was found, what was found
            building it, its nearby open bugs, its idea and its phase with the
            phase's other stories. The board works that set out; the index
            only ranks inside it. When nothing matches there, the whole
            workspace is searched. The answer carries `scope`. An unknown
            story is a 404.
          schema: { type: string, example: S-4 }
      responses:
        "200":
          description: The matches, best first; empty when nothing matches
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/SearchResult" }
                  scope:
                    type: string
                    enum: [story, workspace]
                    description: >-
                      Where the matches were found. Present only when `story`
                      was given: `story` for its neighbourhood, `workspace`
                      when nothing matched there and the whole workspace was
                      searched.
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: Search is unavailable; the board itself is unaffected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/workspaces/{ws}/batch:
    parameters:
      - $ref: "#/components/parameters/Workspace"
    post:
      summary: Make many board changes in one call
      description: >-
        Sends each request, in order, to its own route in this workspace, as
        the caller, so it is answered exactly as if sent alone. A request
        that fails is answered with its status and reason and doesn't stop
        the rest; nothing is undone. Only POST, PATCH and DELETE requests can
        be batched, and each path is relative to the workspace. A request can
        name only items that already exist, not one an earlier request in the
        batch adds. A batch holds 1 to 100 requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requests]
              properties:
                requests:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties: false
                    required: [method, path]
                    properties:
                      method: { type: string, enum: [POST, PATCH, DELETE] }
                      path:
                        type: string
                        description: relative to the workspace
                        example: stories/S-4/status
                      body:
                        description: the route's own request body
                        type: object
      responses:
        "200":
          description: Each request's answer, in order
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [status]
                      properties:
                        status: { type: integer, example: 200 }
                        body:
                          description: the route's own answer; absent for 204
                          type: object
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
components:
  parameters:
    Workspace:
      name: ws
      in: path
      required: true
      schema: { type: string, example: my-app }
    PhaseNumber:
      name: n
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    StoryID:
      name: id
      in: path
      required: true
      schema: { type: string, example: S-2 }
    IdeaID:
      name: id
      in: path
      required: true
      schema: { type: string, example: I-2 }
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  schemas:
    Health:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ok, degraded] }
        checks:
          type: object
          additionalProperties: { type: string, enum: [ok, unavailable] }
          example: { falkordb: ok, typesense: ok }
    Workspace:
      type: object
      required: [slug, name, has_release_stage, created_by, created_at]
      properties:
        slug: { type: string }
        name: { type: string }
        repo_url: { type: string }
        has_release_stage: { type: boolean }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
    Branch:
      type: object
      required: [name, release, created_by, created_at]
      properties:
        name: { type: string }
        into: { type: string, description: The branch this one merges into; absent on the release branch. }
        alias: { type: string, description: "Display name only: the web board's column heading shows it; everything else uses the name. Absent when none is set." }
        release: { type: boolean, description: True for the branch that merges nowhere. }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
    Release:
      type: object
      required: [id, version, tag, created_by, created_at, stories]
      properties:
        id: { type: string, example: R-1 }
        version: { type: string, example: v1.0.0 }
        tag: { type: string, example: v1.0.0 }
        commit: { type: string }
        notes: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        stories:
          type: array
          items: { type: string, example: S-12 }
          description: The stories it released, in delivery order
    ReleaseDetail:
      type: object
      required: [id, version, tag, created_by, created_at, stories]
      properties:
        id: { type: string, example: R-1 }
        version: { type: string, example: v1.0.0 }
        tag: { type: string, example: v1.0.0 }
        commit: { type: string }
        notes: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        stories:
          type: array
          description: The stories it released, in full, in delivery order
          items: { $ref: "#/components/schemas/Story" }
    Phase:
      type: object
      required: [number, title, description, goals, stories_total, stories_complete, complete, goals_met_early, created_by, created_at]
      properties:
        number: { type: integer }
        title: { type: string }
        description: { type: string }
        goals:
          type: array
          items: { $ref: "#/components/schemas/Goal" }
        stories_total: { type: integer, description: "Its stories, leaving out closed ones" }
        stories_complete: { type: integer, description: "Its stories that are merged or released" }
        complete: { type: boolean, description: "Every story left is complete; with nothing left in it, every goal is met" }
        goals_met_early: { type: boolean, description: "Every goal is met but some stories are still open" }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_by: { type: string, description: "Who last edited it" }
        updated_at: { type: string, format: date-time }
    Goal:
      type: object
      required: [id, text, met, created_by, created_at]
      properties:
        id: { type: string, example: G-1 }
        text: { type: string }
        met: { type: boolean }
        met_by: { type: string }
        met_at: { type: string, format: date-time }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
    Story:
      type: object
      required: [id, title, description, goal, plan, status, blocked, blocked_by, blocks, created_by, created_at]
      properties:
        id: { type: string, example: S-2 }
        title: { type: string }
        description: { type: string }
        goal: { type: string }
        plan: { type: string }
        kind: { type: string, enum: [bug], description: "Absent unless the story is a bug" }
        phase: { type: integer, description: "Absent for a story with no phase" }
        status: { $ref: "#/components/schemas/Status" }
        blocked: { type: boolean, description: "A story it depends on is not yet complete" }
        blocked_by:
          type: array
          description: Stories this one depends on that are not yet complete (merged or released). Finished dependencies stay recorded but are not listed.
          items: { type: string }
        blocks:
          type: array
          description: Stories that are not closed and depend on this one while it is not complete. Empty once it is complete.
          items: { type: string }
        found_in: { type: string, description: "The story this one was found while building; absent if none" }
        found:
          type: array
          description: Stories found while building this one
          items: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        moved_by: { type: string }
        moved_at: { type: string, format: date-time }
        updated_by: { type: string, description: "Who last edited it or removed one of its dependencies" }
        updated_at: { type: string, format: date-time }
        held_from: { $ref: "#/components/schemas/Status" }
        hold_reason: { type: string }
        activity: { $ref: "#/components/schemas/Activity" }
        waiting_on: { type: string }
        branch: { type: string }
        into: { type: string, description: "A merged story: the furthest branch it reached" }
        pr_url: { type: string }
        workaround: { type: string, description: "How it was started while blocked" }
        upstream_changed:
          type: object
          description: >-
            Set when a story this one depends on, directly or further down, had
            its goal or plan changed; the most recent such change. Absent when
            there is none. Cleared by updating this story's goal or plan, or by
            the reviewed action.
          required: [story, at]
          properties:
            story: { type: string, example: S-4 }
            at: { type: string, format: date-time }
        release:
          type: object
          description: >-
            The release a released story shipped in. Absent before release, and
            for a story released before releases were recorded.
          required: [id, version]
          properties:
            id: { type: string, example: R-1 }
            version: { type: string, example: v1.0.0 }
    Status:
      type: string
      enum: [proposed, backlog, in_progress, in_review, merged, released, on_hold, closed]
      description: >-
        Merged (into any branch) and released are complete. Released is reached
        only by cutting a release, never by a status change; the old `deployed`
        status became released. A proposed story waits for
        a person to approve it into the backlog, or to decline it by closing it.
    Activity:
      type: string
      enum: [planning, building, testing, waiting]
      description: What an in-progress story is doing.
    Event:
      type: object
      required: [id, at, kind, line]
      properties:
        id: { type: string, example: L-41, description: Its position. }
        at: { type: string, example: "2026-10-29T14:03:09Z", description: When, in UTC to the second. }
        kind: { type: string, enum: [decision, correction, status, story, idea, release] }
        story: { type: string, example: S-50, description: The story a log entry belongs to. }
        to: { type: string, example: merged, description: The status a status entry moved to. }
        line: { type: string, example: "L-41 2026-10-29 14:03 S-50 decision: Keep ranks as text — the store orders them as Go does" }
    StoryContext:
      type: object
      required: [id, title, status, depends_on, depended_on_by, found, bugs]
      properties:
        id: { type: string, example: S-3 }
        title: { type: string }
        status: { type: string }
        phase:
          type: object
          description: The phase the story is in; absent when it has none
          required: [number, title, goals]
          properties:
            number: { type: integer }
            title: { type: string }
            goals:
              type: array
              items:
                type: object
                required: [id, text, met]
                properties:
                  id: { type: string, example: G-1 }
                  text: { type: string }
                  met: { type: boolean }
        idea:
          type: object
          description: The idea that became this story; absent when none did
          required: [id, title]
          properties:
            id: { type: string, example: I-1 }
            title: { type: string }
        depends_on:
          type: array
          description: Every dependency, finished ones included, in delivery order
          items: { $ref: "#/components/schemas/ContextLink" }
        depended_on_by:
          type: array
          description: Every story that depends on this one, in delivery order
          items: { $ref: "#/components/schemas/ContextLink" }
        found_in: { $ref: "#/components/schemas/ContextStory" }
        found:
          type: array
          description: The stories found while building this one
          items: { $ref: "#/components/schemas/ContextStory" }
        bugs:
          type: array
          description: Open bugs found in this story or a direct dependency, in delivery order, at most five
          items:
            type: object
            required: [id, title, status, found_in]
            properties:
              id: { type: string }
              title: { type: string }
              status: { type: string }
              found_in: { type: string, description: The story the bug was found in }
    ContextStory:
      type: object
      required: [id, title, status]
      properties:
        id: { type: string }
        title: { type: string }
        status: { type: string }
    ContextLink:
      type: object
      required: [id, title, status, decisions]
      properties:
        id: { type: string }
        title: { type: string }
        status: { type: string }
        decisions:
          type: array
          description: Its last three decisions, oldest first
          items:
            type: object
            required: [id, text, reason]
            properties:
              id: { type: string, example: L-4 }
              text: { type: string }
              reason: { type: string }
              corrected: { type: boolean, description: "Sent only when true: a later correction points at this decision" }
    LogEntry:
      type: object
      required: [id, at, actor, kind]
      properties:
        id: { type: string, example: L-4 }
        at: { type: string, format: date-time }
        actor: { type: string }
        kind: { type: string, enum: [note, decision, commit, pr, status, correction, edit] }
        field: { type: string, enum: [title, description, text], description: "An edit entry: the field changed" }
        text: { type: string }
        reason: { type: string }
        commit: { type: string }
        pr_url: { type: string }
        branch: { type: string }
        into: { type: string, description: "A merge: the branch it reached" }
        from:
          description: A status entry's old status, or an edit entry's old value
          type: string
        to:
          description: A status entry's new status, or an edit entry's new value
          type: string
        corrects: { type: string, description: "The entry this one corrects" }
        corrected_by:
          type: array
          description: Entries that correct this one
          items: { type: string }
    Where:
      type: object
      required: [phase, proposed, in_progress, in_review, on_hold, next, unreleased, upstream_changed]
      properties:
        phase:
          description: The first phase that is not complete; null when there is none
          oneOf:
            - $ref: "#/components/schemas/Phase"
            - type: "null"
        proposed:
          type: array
          description: What is waiting for a person to approve it
          items: { $ref: "#/components/schemas/Story" }
        in_progress:
          type: array
          items: { $ref: "#/components/schemas/Story" }
        in_review:
          type: array
          items: { $ref: "#/components/schemas/Story" }
        on_hold:
          type: array
          items: { $ref: "#/components/schemas/Story" }
        next:
          type: array
          description: The top three of the backlog, blocked stories included
          items: { $ref: "#/components/schemas/Story" }
        unreleased:
          type: array
          description: Merged into the release branch and not yet in a release, in delivery order
          items: { $ref: "#/components/schemas/Story" }
        upstream_changed:
          type: array
          description: Stories not yet complete or closed whose upstream story changed its goal or plan, in delivery order
          items: { $ref: "#/components/schemas/Story" }
    Idea:
      type: object
      required: [id, title, context, state, became_stories, created_by, created_at]
      properties:
        id: { type: string, example: I-3 }
        title: { type: string }
        context:
          type: string
          description: Anything that helps understand the idea and turn it into work
        state:
          type: string
          enum: [open, closed]
        became_stories:
          type: array
          description: The stories a refined idea became
          items: { type: string }
        became_phase: { type: integer, description: "The phase a refined idea became" }
        drop_reason: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        moved_by: { type: string }
        moved_at: { type: string, format: date-time }
        updated_by: { type: string }
        updated_at: { type: string, format: date-time }
        closed_by: { type: string }
        closed_at: { type: string, format: date-time }
    Position:
      type: object
      description: >-
        Directly before or after a story (or, for an idea, another idea);
        neither means the bottom of the list.
      additionalProperties: false
      properties:
        before: { type: string, example: S-3 }
        after: { type: string, example: S-2 }
    SearchResult:
      type: object
      required: [kind, id, title]
      properties:
        kind: { type: string, enum: [story, idea, phase] }
        id:
          type: string
          description: A story's or idea's id, or a phase's number
          example: S-4
        title: { type: string }
        state:
          type: string
          description: >-
            A story's status, or an idea's state (open or closed). A
            phase has none.
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
  responses:
    Invalid:
      description: >-
        The request is malformed. Text may not contain control or invisible
        formatting characters other than newlines, carriage returns and tabs.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such workspace, phase, goal, story, log entry or dependency
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: The change would break a board rule; the error says which
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, malformed, unknown or revoked token
      headers:
        WWW-Authenticate:
          schema: { type: string, const: Bearer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: Tokens cannot be checked because the store is unreachable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
