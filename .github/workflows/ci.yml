name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  gates:
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb/falkordb-server:v4.20.7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s
          --health-timeout 2s --health-retries 15
      typesense:
        image: typesense/typesense:30.2
        ports: ["8108:8108"]
        env:
          TYPESENSE_DATA_DIR: /tmp
          TYPESENSE_API_KEY: ci-only
    env:
      BACKPACK_TEST_FALKORDB: falkor://localhost:6379
      BACKPACK_TEST_TYPESENSE: http://localhost:8108
      BACKPACK_TEST_TYPESENSE_KEY: ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Wait for Typesense
        run: |
          for i in $(seq 30); do curl -fs localhost:8108/health && exit 0; sleep 1; done
          echo "Typesense did not become healthy"; exit 1
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
      - name: go build
        run: go build ./...
