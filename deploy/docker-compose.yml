# Backpack's stack. Locally: `make up`. Ports are bound to 127.0.0.1 only and
# chosen to avoid the usual 6379/8108/8080, which other stacks often hold.
name: backpack

services:
  backpack:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      BACKPACK_ADDR: ":8780"
      BACKPACK_FALKORDB_URL: "falkor://falkordb:6379"
      BACKPACK_TYPESENSE_URL: "http://typesense:8108"
    ports:
      - "127.0.0.1:8780:8780"
    depends_on:
      falkordb:
        condition: service_healthy
      typesense:
        condition: service_started
    restart: unless-stopped

  falkordb:
    image: falkordb/falkordb-server:v4.20.7
    environment:
      # Every write is on disk before it is confirmed; FalkorDB is the only
      # copy of the board.
      REDIS_ARGS: "--appendonly yes --appendfsync always"
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
    restart: unless-stopped

  typesense:
    image: typesense/typesense:30.2
    environment:
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:?set TYPESENSE_API_KEY}
    volumes:
      - typesense-data:/data
    ports:
      - "127.0.0.1:18108:8108"
    restart: unless-stopped

volumes:
  falkordb-data:
  typesense-data:
